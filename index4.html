<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(145deg, #f0f7ff 0%, #e6f0fa 50%, #dce8f5 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 12px;
        }

        .glass-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 12px 14px 14px 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        /* ========== 标题栏 ========== */
        h1 {
            font-size: 18px;
            color: #ffffff;
            text-align: center;
            padding: 10px 16px;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 48px;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 45%, #56d4dd 80%, #a8d8ea 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.25);
        }
        h1::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 10%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 60px -30px 0 10px rgba(255, 255, 255, 0.1), 120px -10px 0 5px rgba(255, 255, 255, 0.15), 200px -40px 0 20px rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: -80px -20px 0 15px rgba(255, 255, 255, 0.08), -150px -50px 0 8px rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        h1 .title-left { display: flex; align-items: center; gap: 8px; position: relative; z-index: 1; }
        h1 .title-left .app-name { font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 .title-left .version-tag {
            font-size: 10px;
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .ds-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }
        .ds-icon span {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 60%, #36d1dc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-actions { display: flex; gap: 6px; align-items: center; position: relative; z-index: 1; }
        .header-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .header-actions button:active { transform: scale(0.95); }
        .btn-new { background: rgba(255,255,255,0.15); }
        .toggle-collapse-btn { background: rgba(255,255,255,0.1); }

        /* ========== 折叠 ========== */
        .collapsible-section {
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
            max-height: 500px;
            opacity: 1;
            overflow: hidden;
            margin-bottom: 0;
        }
        .collapsible-section.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }
        .collapsed-mode h1 {
            padding: 6px 16px;
            min-height: 38px;
            margin-bottom: 4px;
        }
        .collapsed-mode .session-bar {
            border-bottom: none;
            margin-bottom: 2px;
            padding-top: 2px;
            padding-bottom: 2px;
        }
        .collapsed-mode .session-tab {
            padding: 2px 10px;
            font-size: 11px;
        }
        .collapsed-mode .btn-add-session {
            padding: 2px 10px;
            font-size: 11px;
        }

        /* ========== API Key ========== */
        .api-section {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            font-size: 12px;
            outline: none;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .api-section input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.15);
            background: rgba(255,255,255,0.8);
        }
        .api-section input::placeholder { color: rgba(0,0,0,0.3); }
        .api-section button {
            padding: 8px 18px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
            transition: all 0.3s;
        }
        .api-section button:active { transform: scale(0.97); }

        /* ========== 会话标签栏 ========== */
        .session-bar {
            display: flex;
            gap: 4px;
            padding: 4px 0 8px;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }
        .session-bar::-webkit-scrollbar { height: 2px; }
        .session-bar::-webkit-scrollbar-thumb { background: rgba(79, 172, 254, 0.3); border-radius: 10px; }
        .session-tab {
            padding: 4px 14px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: rgba(0,0,0,0.6);
            transition: all 0.25s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .session-tab.active {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
            padding: 0 2px;
        }
        .session-tab .del-session:hover { opacity: 1; }
        .btn-add-session {
            padding: 4px 12px;
            background: rgba(79, 172, 254, 0.1);
            color: #4facfe;
            border: 1px dashed rgba(79, 172, 254, 0.3);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-add-session:hover { background: rgba(79, 172, 254, 0.2); }
        .btn-add-session:active { transform: scale(0.95); }

        /* ========== 聊天框 ========== */
        .chat-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 16px 14px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 150px;
        }
        .chat-box::-webkit-scrollbar { width: 3px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(79, 172, 254, 0.3); border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.55) 0%, rgba(0, 210, 255, 0.4) 60%, rgba(79, 210, 240, 0.2) 100%);
            color: #1a3a5c;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(79, 172, 254, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .message.error {
            align-self: center;
            background: rgba(254, 226, 226, 0.7);
            color: #dc2626;
            font-size: 12px;
            max-width: 90%;
            text-align: center;
            border-radius: 12px;
            padding: 8px 16px;
        }
        .message.loading {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.6);
            color: #999;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 4px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== 输入区域 ========== */
        .input-section {
            display: flex;
            gap: 8px;
            padding: 8px 0 0;
            flex-shrink: 0;
        }
        .input-section textarea {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 100px;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .input-section textarea:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.1);
            background: rgba(255,255,255,0.7);
        }
        .input-section textarea::placeholder { color: rgba(0,0,0,0.3); }
        .input-section button {
            padding: 10px 22px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            flex-shrink: 0;
            height: 46px;
            box-shadow: 0 4px 14px rgba(79, 172, 254, 0.3);
            transition: all 0.3s;
        }
        .input-section button:active { transform: scale(0.95); }
        .input-section button:disabled {
            background: rgba(0,0,0,0.1);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ========== 底部状态 ========== */
        .status-tip {
            text-align: center;
            font-size: 10px;
            color: rgba(0,0,0,0.35);
            padding: 4px 0 2px;
            flex-shrink: 0;
        }
        .status-tip .sync-status {
            font-size: 10px;
            color: rgba(0,0,0,0.35);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-tip .sync-status .sync-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 24px;
            border-radius: 14px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
                padding-top: max(8px, env(safe-area-inset-top));
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <!-- ===== 标题栏 ===== -->
        <h1>
            <div class="title-left">
                <span class="ds-icon"><span>DS</span></span>
                <span class="app-name">DeepSeek</span>
                <span class="version-tag">V4</span>
            </div>
            <div class="header-actions">
                <button class="toggle-collapse-btn" id="toggleCollapseBtn">⬆ 收起</button>
                <button class="btn-new" id="newSessionBtn">➕</button>
            </div>
        </h1>

        <!-- ===== 折叠区域 ===== -->
        <div class="collapsible-section" id="collapsibleSection">
            <div class="api-section">
                <input type="password" id="apiKeyInput" placeholder="输入 API Key" />
                <button id="saveKeyBtn">保存</button>
            </div>
            <!-- 为了简洁，这里不放置控制栏，功能在后续步骤加入 -->
        </div>

        <!-- ===== 会话标签 ===== -->
        <div class="session-bar" id="sessionBar"></div>

        <!-- ===== 聊天框 ===== -->
        <div class="chat-box" id="chatBox"></div>

        <!-- ===== 底部状态 ===== -->
        <div class="status-tip" id="statusTip">
            <span class="sync-status" id="syncStatus">
                <span class="sync-dot" id="syncDot"></span>
                <span id="syncText">已同步</span>
            </span>
            💡 DeepSeek-V4-Flash
        </div>

        <!-- ===== 输入区域 ===== -->
        <div class="input-section">
            <textarea id="userInput" rows="1" placeholder="输入消息..." disabled></textarea>
            <button id="sendBtn" disabled>发送</button>
        </div>
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ============================================================
        //  全局状态
        // ============================================================
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let sessions = [];
        let currentSessionId = null;
        let isCollapsed = false;

        // ============================================================
        //  DOM 引用
        // ============================================================
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');
        const sessionBar = document.getElementById('sessionBar');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const toggleBtn = document.getElementById('toggleCollapseBtn');
        const collapsibleSection = document.getElementById('collapsibleSection');

        // ============================================================
        //  Toast
        // ============================================================
        let toastTimer = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        //  折叠功能
        // ============================================================
        toggleBtn.addEventListener('click', function() {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                collapsibleSection.classList.add('collapsed');
                toggleBtn.textContent = '⬇ 展开';
                document.body.classList.add('collapsed-mode');
            } else {
                collapsibleSection.classList.remove('collapsed');
                toggleBtn.textContent = '⬆ 收起';
                document.body.classList.remove('collapsed-mode');
            }
        });

        // ============================================================
        //  会话管理
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        }

        function getSessionName(messages) {
            for (var i = 0; i < messages.length; i++) {
                if (messages[i].role === 'user') {
                    var txt = messages[i].content.replace(/\n/g, ' ').trim();
                    return txt.length > 15 ? txt.substring(0, 15) + '…' : txt;
                }
            }
            return '新对话';
        }

        function createSession(name) {
            return { id: generateId(), name: name || '新对话', messages: [] };
        }

        function saveSessions() {
            localStorage.setItem('deepseek_sessions', JSON.stringify(sessions));
            if (currentSessionId) {
                localStorage.setItem('deepseek_current_session', currentSessionId);
            }
        }

        function loadSessions() {
            var data = localStorage.getItem('deepseek_sessions');
            if (data) {
                try { sessions = JSON.parse(data); } catch (e) { sessions = []; }
            } else { sessions = []; }
            if (sessions.length === 0) {
                var s = createSession('对话 1');
                sessions.push(s);
            }
            var savedCurrent = localStorage.getItem('deepseek_current_session');
            if (savedCurrent) {
                var found = false;
                for (var i = 0; i < sessions.length; i++) {
                    if (sessions[i].id === savedCurrent) { found = true; break; }
                }
                currentSessionId = found ? savedCurrent : sessions[0].id;
            } else {
                currentSessionId = sessions[0].id;
            }
        }

        function getCurrentSession() {
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].id === currentSessionId) return sessions[i];
            }
            return sessions[0];
        }

        function switchSession(sessionId) {
            if (sessionId === currentSessionId) return;
            currentSessionId = sessionId;
            localStorage.setItem('deepseek_current_session', currentSessionId);
            renderChat();
            renderSessionTabs();
        }

        function deleteSession(sessionId) {
            if (sessions.length <= 1) {
                showToast('至少保留一个对话');
                return;
            }
            if (!confirm('确定删除这个对话吗？')) return;
            var newSessions = [];
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].id !== sessionId) newSessions.push(sessions[i]);
            }
            sessions = newSessions;
            if (currentSessionId === sessionId) {
                currentSessionId = sessions[0].id;
                localStorage.setItem('deepseek_current_session', currentSessionId);
            }
            saveSessions();
            renderSessionTabs();
            renderChat();
            showToast('已删除');
        }

        function addNewSession() {
            var s = createSession('新对话');
            sessions.push(s);
            currentSessionId = s.id;
            saveSessions();
            renderSessionTabs();
            renderChat();
            if (API_KEY) userInput.focus();
            showToast('✅ 已创建新对话');
        }

        // ============================================================
        //  渲染会话标签
        // ============================================================
        function renderSessionTabs() {
            sessionBar.innerHTML = '';
            for (var i = 0; i < sessions.length; i++) {
                var s = sessions[i];
                var btn = document.createElement('button');
                btn.className = 'session-tab' + (s.id === currentSessionId ? ' active' : '');
                var nameSpan = document.createElement('span');
                nameSpan.textContent = s.name || '新对话';
                btn.appendChild(nameSpan);
                if (sessions.length > 1) {
                    var del = document.createElement('button');
                    del.className = 'del-session';
                    del.textContent = '✕';
                    del.addEventListener('click', (function(id) {
                        return function(e) {
                            e.stopPropagation();
                            deleteSession(id);
                        };
                    })(s.id));
                    btn.appendChild(del);
                }
                btn.addEventListener('click', (function(id) {
                    return function() { switchSession(id); };
                })(s.id));
                sessionBar.appendChild(btn);
            }
            var addBtn = document.createElement('button');
            addBtn.className = 'btn-add-session';
            addBtn.textContent = '+';
            addBtn.addEventListener('click', addNewSession);
            sessionBar.appendChild(addBtn);
        }

        // ============================================================
        //  渲染聊天
        // ============================================================
        function renderChat() {
            var session = getCurrentSession();
            chatBox.innerHTML = '';
            if (!session || session.messages.length === 0) {
                var div = document.createElement('div');
                div.className = 'message assistant';
                div.textContent = API_KEY ? '👋 开始新对话吧！' : '👋 请先输入 API Key';
                chatBox.appendChild(div);
                return;
            }
            for (var i = 0; i < session.messages.length; i++) {
                var msg = session.messages[i];
                var div = document.createElement('div');
                div.className = 'message ' + msg.role;
                div.textContent = msg.content;
                chatBox.appendChild(div);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ============================================================
        //  启用聊天
        // ============================================================
        function enableChat(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                userInput.focus();
                statusTip.innerHTML = '<span class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">已同步</span></span> 💡 DeepSeek-V4-Flash';
            } else {
                statusTip.innerHTML = '<span class="sync-status"><span class="sync-dot error" id="syncDot"></span><span id="syncText">未登录</span></span> ⏳ 请先输入 API Key';
            }
        }

        // ============================================================
        //  保存 API Key
        // ============================================================
        saveKeyBtn.addEventListener('click', function() {
            var key = apiKeyInput.value.trim();
            if (!key) { showToast('请输入 API Key'); return; }
            if (!key.startsWith('sk-')) { showToast('格式错误，应以 sk- 开头'); return; }
            API_KEY = key;
            localStorage.setItem('deepseek_api_key', key);
            enableChat(true);
            // 清除错误消息
            var session = getCurrentSession();
            var newMsgs = [];
            for (var i = 0; i < session.messages.length; i++) {
                if (session.messages[i].role !== 'error') newMsgs.push(session.messages[i]);
            }
            session.messages = newMsgs;
            if (session.messages.length === 0) {
                session.messages.push({ role: 'assistant', content: '✅ API Key 已保存！' });
            } else {
                session.messages.push({ role: 'assistant', content: '✅ API Key 已更新！' });
            }
            saveSessions();
            renderChat();
            showToast('✅ API Key 已保存');
        });

        // ============================================================
        //  发送消息（核心 - 来自 final.html，可靠！）
        // ============================================================
        async function sendMessage() {
            var msg = userInput.value.trim();
            if (!msg) { showToast('请输入消息'); return; }

            var key = localStorage.getItem('deepseek_api_key');
            if (!key) { showToast('请先保存 API Key'); return; }

            var session = getCurrentSession();

            // 添加用户消息
            session.messages.push({ role: 'user', content: msg });
            userInput.value = '';
            saveSessions();
            renderChat();

            // 加载状态
            session.messages.push({ role: 'loading', content: '🤔 思考中...' });
            renderChat();
            sendBtn.disabled = true;

            try {
                var response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        messages: [
                            { role: 'system', content: '你是DeepSeek，一个有用的AI助手。请用中文简洁回复。' },
                            { role: 'user', content: msg }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });

                var data = await response.json();
                console.log('📥 响应:', data);

                // 移除加载
                var newMsgs = [];
                for (var i = 0; i < session.messages.length; i++) {
                    if (session.messages[i].role !== 'loading') newMsgs.push(session.messages[i]);
                }
                session.messages = newMsgs;

                if (!response.ok) {
                    var errMsg = data.error ? data.error.message : '请求失败';
                    throw new Error('错误 ' + response.status + ': ' + errMsg);
                }

                if (data.choices && data.choices[0]) {
                    var reply = data.choices[0].message.content;
                    session.messages.push({ role: 'assistant', content: reply });
                    // 如果会话是"新对话"且有用户消息，自动命名
                    if (session.name === '新对话' && session.messages.length > 0) {
                        session.name = getSessionName(session.messages);
                    }
                    saveSessions();
                    renderChat();
                    renderSessionTabs();
                    console.log('✅ 回复成功');
                } else {
                    throw new Error('API 返回异常');
                }

            } catch (error) {
                // 移除加载
                var newMsgs2 = [];
                for (var j = 0; j < session.messages.length; j++) {
                    if (session.messages[j].role !== 'loading') newMsgs2.push(session.messages[j]);
                }
                session.messages = newMsgs2;

                var errorText = '❌ ' + error.message;
                if (error.message.includes('401') || error.message.includes('403')) {
                    errorText = '❌ API Key 无效，请重新输入';
                    localStorage.removeItem('deepseek_api_key');
                    API_KEY = '';
                    enableChat(false);
                    apiKeyInput.value = '';
                } else if (error.message.includes('Failed to fetch')) {
                    errorText = '❌ 网络连接失败';
                }
                session.messages.push({ role: 'error', content: errorText });
                saveSessions();
                renderChat();
                console.error('❌ 错误:', error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        newSessionBtn.addEventListener('click', addNewSession);

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            loadSessions();
            renderSessionTabs();

            if (API_KEY) {
                apiKeyInput.value = API_KEY;
                enableChat(true);
                var session = getCurrentSession();
                if (session.messages.length === 0) {
                    session.messages.push({ role: 'assistant', content: '👋 你好！API Key 已加载。' });
                    saveSessions();
                }
                renderChat();
                console.log('✅ 已加载 API Key');
            } else {
                var session = getCurrentSession();
                if (session.messages.length === 0) {
                    session.messages.push({ role: 'assistant', content: '👋 请输入 API Key 并保存。' });
                    saveSessions();
                }
                renderChat();
                apiKeyInput.focus();
            }
            console.log('🚀 index4 整合版已启动！');
        }

        init();

        // 暴露到全局
        window.sendMessage = sendMessage;
    </script>
</body>
