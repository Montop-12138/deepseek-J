<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f0f4ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(79,172,254,0.3);
        }
        .ds-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #4facfe;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .api-section {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .api-section input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid rgba(79,172,254,0.2);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .api-section input:focus { border-color: #4facfe; }
        .api-section button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-box {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 16px;
            overflow-y: auto;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            margin-bottom: 12px;
            min-height: 200px;
        }
        .message {
            padding: 8px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 85%;
        }
        .message.user {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #f0f2f5;
            color: #1a1a2e;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            text-align: center;
            margin: 0 auto;
        }
        .input-section {
            display: flex;
            gap: 8px;
        }
        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .input-section input:focus { border-color: #4facfe; }
        .input-section button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .input-section button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .status {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="ds-icon">DS</span>
        <h1>DeepSeek 测试</h1>
    </div>

    <div class="api-section">
        <input type="password" id="apiKeyInput" placeholder="输入 API Key (sk-...)" />
        <button id="saveKeyBtn">保存</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-section">
        <input type="text" id="userInput" placeholder="输入消息..." disabled />
        <button id="sendBtn" disabled>发送</button>
    </div>

    <div class="status" id="statusTip">💡 请先输入 API Key</div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // DOM 引用
        // ============================================================
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');

        let API_KEY = localStorage.getItem('deepseek_api_key') || '';

        // ============================================================
        // Toast 提示
        // ============================================================
        let toastTimer = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 添加消息到聊天框
        // ============================================================
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ============================================================
        // 启用/禁用聊天
        // ============================================================
        function enableChat(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                userInput.focus();
                statusTip.textContent = '💡 已就绪，可以聊天了';
                statusTip.style.color = '#4facfe';
            } else {
                statusTip.textContent = '⏳ 请先输入 API Key';
                statusTip.style.color = '#999';
            }
        }

        // ============================================================
        // 保存 API Key
        // ============================================================
        saveKeyBtn.addEventListener('click', function() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showToast('请输入 API Key');
                return;
            }
            if (!key.startsWith('sk-')) {
                showToast('API Key 格式错误，应以 sk- 开头');
                return;
            }
            API_KEY = key;
            localStorage.setItem('deepseek_api_key', key);
            enableChat(true);
            addMessage('assistant', '✅ API Key 已保存，可以开始聊天了！');
            showToast('✅ API Key 已保存');
        });

        // ============================================================
        // 发送消息
        // ============================================================
        async function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) {
                showToast('请输入消息');
                return;
            }

            // 检查 API Key
            const key = localStorage.getItem('deepseek_api_key');
            if (!key) {
                showToast('请先保存 API Key');
                return;
            }

            // 显示用户消息
            addMessage('user', msg);
            userInput.value = '';
            sendBtn.disabled = true;

            // 显示加载状态
            addMessage('assistant', '🤔 思考中...');
            const loadingMsg = chatBox.lastChild;

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        messages: [
                            { role: 'system', content: '你是一个有用的AI助手，请用中文简洁回复。' },
                            { role: 'user', content: msg }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                console.log('📥 API 响应:', data);

                // 移除加载状态
                if (loadingMsg) loadingMsg.remove();

                if (!response.ok) {
                    const errMsg = data.error ? data.error.message : '请求失败';
                    throw new Error('错误 ' + response.status + ': ' + errMsg);
                }

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    addMessage('assistant', reply);
                    console.log('✅ AI 回复成功');
                } else {
                    throw new Error('API 返回异常');
                }

            } catch (error) {
                if (loadingMsg) loadingMsg.remove();
                let errorText = '❌ ' + error.message;
                if (error.message.includes('401') || error.message.includes('403')) {
                    errorText = '❌ API Key 无效或已过期，请重新输入';
                    localStorage.removeItem('deepseek_api_key');
                    API_KEY = '';
                    enableChat(false);
                    apiKeyInput.value = '';
                } else if (error.message.includes('Failed to fetch')) {
                    errorText = '❌ 网络连接失败，请检查网络';
                }
                addMessage('error', errorText);
                console.error('❌ 错误:', error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ============================================================
        // 发送按钮事件
        // ============================================================
        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            if (API_KEY) {
                apiKeyInput.value = API_KEY;
                enableChat(true);
                addMessage('assistant', '👋 你好！API Key 已加载，可以开始聊天了。');
                console.log('✅ 初始化完成，API Key 已加载');
            } else {
                addMessage('assistant', '👋 请在上方输入你的 API Key 并点击保存。');
                apiKeyInput.focus();
            }
        }

        init();

        // ============================================================
        // 暴露 sendMessage 到全局（用于调试）
        // ============================================================
        window.sendMessage = sendMessage;
        console.log('🚀 测试版已启动！在控制台输入 sendMessage() 可手动发送消息。');
    </script>

</body>
</html>
