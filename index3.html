<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4facfe">
    <script src="https://web.sdk.qcloud.com/cloudbase/v1.6.0/cloudbase.full.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 你提供的图片作为背景 */
            background-image: url('https://montop-12138.github.io/deepseek-J/image_1785898602798.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 12px;
        }

        /* 毛玻璃卡片容器 */
        .glass-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 12px 14px 14px 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        /* 标题栏 - 沙滩海岸线渐变 + 气泡静态效果 */
        h1 {
            font-size: 18px;
            color: #ffffff;
            text-align: center;
            padding: 10px 16px;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 48px;
            /* 海岸线渐变 */
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.85) 0%, rgba(0, 210, 255, 0.7) 40%, rgba(79, 210, 240, 0.5) 70%, rgba(160, 230, 240, 0.3) 100%);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            /* 气泡升腾静态效果（用伪元素做泡泡） */
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.25);
        }
        /* 气泡装饰 */
        h1::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 10%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 60px -30px 0 10px rgba(255, 255, 255, 0.1), 120px -10px 0 5px rgba(255, 255, 255, 0.15), 200px -40px 0 20px rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: -80px -20px 0 15px rgba(255, 255, 255, 0.08), -150px -50px 0 8px rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        h1 .title-left { display: flex; align-items: center; gap: 8px; position: relative; z-index: 1; }
        h1 .title-left .app-name { font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 .title-left .version-tag {
            font-size: 10px;
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* DS 图标 - 白色方块 + 蓝色活力字母 */
        .ds-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }
        .ds-icon span {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 60%, #36d1dc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-actions { display: flex; gap: 6px; align-items: center; position: relative; z-index: 1; }
        .header-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .header-actions button:active { transform: scale(0.95); }
        .btn-new { background: rgba(255,255,255,0.15); color: white; }
        .btn-new:hover { background: rgba(255,255,255,0.25); }

        .toggle-collapse-btn { background: rgba(255,255,255,0.1); color: white; }
        .toggle-collapse-btn:hover { background: rgba(255,255,255,0.2); }

        /* 折叠功能 */
        .collapsible-section {
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease, padding 0.3s ease;
            max-height: 500px;
            opacity: 1;
            overflow: hidden;
            margin-bottom: 0;
        }
        .collapsible-section.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }

        .collapsed-mode h1 {
            padding: 6px 16px;
            min-height: 38px;
            margin-bottom: 4px;
        }
        .collapsed-mode .session-bar {
            border-bottom: none;
            margin-bottom: 2px;
            padding-top: 2px;
            padding-bottom: 2px;
        }
        .collapsed-mode .session-tab {
            padding: 2px 10px;
            font-size: 11px;
        }
        .collapsed-mode .btn-add-session {
            padding: 2px 10px;
            font-size: 11px;
        }

        /* API Key */
        .api-section {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            font-size: 12px;
            outline: none;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .api-section input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.15);
            background: rgba(255,255,255,0.8);
        }
        .api-section input::placeholder { color: rgba(0,0,0,0.3); }
        .api-section button {
            padding: 8px 18px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
            transition: all 0.3s;
        }
        .api-section button:active { transform: scale(0.97); }

        /* 控制栏 */
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            padding: 6px 0 8px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
            font-size: 12px;
            color: #1a1a2e;
        }
        .control-bar .slider-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 160px;
        }
        .control-bar .slider-group label { white-space: nowrap; font-weight: 500; font-size: 12px; color: rgba(0,0,0,0.6); }
        .control-bar .slider-group input[type="range"] {
            flex: 1;
            min-width: 50px;
            accent-color: #4facfe;
            height: 4px;
            cursor: pointer;
        }
        .control-bar .slider-value {
            min-width: 30px;
            text-align: center;
            font-weight: 700;
            color: #4facfe;
            font-size: 12px;
        }
        .control-bar .rename-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 140px;
        }
        .control-bar .rename-group input {
            flex: 1;
            padding: 4px 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .control-bar .rename-group input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            background: rgba(255,255,255,0.7);
        }
        .control-bar .rename-group button {
            padding: 4px 12px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .control-bar .rename-group button:active { transform: scale(0.95); }

        /* 分享栏 */
        .share-bar {
            display: flex;
            gap: 4px;
            padding: 4px 0 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .share-bar button {
            padding: 4px 10px;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .share-bar button:active { transform: scale(0.95); }
        .share-bar .btn-copy { background: linear-gradient(135deg, #4facfe, #00d4ff); color: white; border: none; }
        .share-bar .btn-copy-all { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; }
        .share-bar .btn-export { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; border: none; }
        .share-bar .btn-select-mode { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; border: none; }
        .share-bar .btn-select-mode.active { background: linear-gradient(135deg, #f5576c, #ff6b6b); }
        .share-bar .select-info {
            font-size: 11px;
            color: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.4);
            padding: 2px 10px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }
        .share-bar .select-info input[type="checkbox"] {
            accent-color: #4facfe;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* 会话标签 */
        .session-bar {
            display: flex;
            gap: 4px;
            padding: 4px 0 8px;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }
        .session-bar::-webkit-scrollbar { height: 2px; }
        .session-bar::-webkit-scrollbar-thumb { background: rgba(79, 172, 254, 0.3); border-radius: 10px; }
        .session-tab {
            padding: 4px 14px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: rgba(0,0,0,0.6);
            transition: all 0.25s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .session-tab.active {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
            padding: 0 2px;
        }
        .session-tab .del-session:hover { opacity: 1; }
        .btn-add-session {
            padding: 4px 12px;
            background: rgba(79, 172, 254, 0.1);
            color: #4facfe;
            border: 1px dashed rgba(79, 172, 254, 0.3);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-add-session:hover { background: rgba(79, 172, 254, 0.2); }
        .btn-add-session:active { transform: scale(0.95); }

        /* 聊天框 - 毛玻璃卡片 */
        .chat-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 16px 14px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 150px;
        }
        .chat-box::-webkit-scrollbar { width: 3px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(79, 172, 254, 0.3); border-radius: 10px; }

        /* 消息包装器 */
        .message-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
            width: 100%;
        }
        .message-wrapper.user-wrapper { align-items: flex-end; }
        .message-wrapper .msg-actions {
            display: none;
            gap: 4px;
            margin-top: 2px;
            font-size: 11px;
        }
        .message-wrapper:hover .msg-actions { display: flex; }
        .message-wrapper .msg-actions button {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 6px;
            padding: 1px 8px;
            font-size: 10px;
            cursor: pointer;
            color: rgba(0,0,0,0.6);
            transition: all 0.2s;
        }
        .message-wrapper .msg-actions button:hover { background: white; }
        .message-wrapper .msg-actions .del-msg-btn { color: #dc2626; }
        .message-wrapper .msg-actions .edit-msg-btn { color: #4facfe; }

        /* 选择模式 */
        .message-wrapper.select-mode .msg-actions { display: none !important; }
        .message-wrapper .msg-checkbox {
            display: none;
            margin-right: 6px;
            align-self: center;
            accent-color: #4facfe;
            width: 16px;
            height: 16px;
        }
        .message-wrapper.select-mode .msg-checkbox { display: inline-block; }
        .message-wrapper.select-mode { flex-direction: row; align-items: center; gap: 4px; }
        .message-wrapper.select-mode .message { flex: 1; }

        /* 消息气泡 */
        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        /* 用户消息 - 淡蓝色渐变 + 发光效果 */
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.6) 0%, rgba(0, 210, 255, 0.45) 60%, rgba(79, 210, 240, 0.25) 100%);
            color: #1a3a5c;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(79, 172, 254, 0.2), 0 0 20px rgba(79, 172, 254, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* AI 消息 - 不变（毛玻璃） */
        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .message.error {
            align-self: center;
            background: rgba(254, 226, 226, 0.7);
            backdrop-filter: blur(4px);
            color: #dc2626;
            font-size: 12px;
            max-width: 90%;
            text-align: center;
            border-radius: 12px;
            padding: 8px 16px;
        }
        .message .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 编辑模式 */
        .message.edit-mode .message-content { display: none; }
        .message.edit-mode .edit-textarea { display: block; }
        .message .edit-textarea {
            display: none;
            width: 100%;
            min-width: 180px;
            padding: 8px 12px;
            border: 2px solid #4facfe;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            background: rgba(255,255,255,0.9);
            outline: none;
        }
        .message .edit-actions {
            display: none;
            gap: 6px;
            margin-top: 6px;
        }
        .message.edit-mode .edit-actions { display: flex; }
        .message .edit-actions button {
            padding: 3px 14px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }
        .message .edit-actions .save-edit { background: #11998e; color: white; }
        .message .edit-actions .cancel-edit { background: rgba(0,0,0,0.08); color: #555; }

        /* 输入框 - 不变 */
        .input-section {
            display: flex;
            gap: 8px;
            padding: 8px 0 0;
            flex-shrink: 0;
        }
        .input-section textarea {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 100px;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .input-section textarea:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.1);
            background: rgba(255,255,255,0.7);
        }
        .input-section textarea::placeholder { color: rgba(0,0,0,0.3); }
        .input-section button {
            padding: 10px 22px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            flex-shrink: 0;
            height: 46px;
            box-shadow: 0 4px 14px rgba(79, 172, 254, 0.3);
            transition: all 0.3s;
        }
        .input-section button:active { transform: scale(0.95); }
        .input-section button:disabled {
            background: rgba(0,0,0,0.1);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 底部状态 */
        .status-tip {
            text-align: center;
            font-size: 10px;
            color: rgba(0,0,0,0.35);
            padding: 4px 0 2px;
            flex-shrink: 0;
        }
        .status-tip .sync-status {
            font-size: 10px;
            color: rgba(0,0,0,0.35);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-tip .sync-status .sync-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }
        .status-tip .sync-status .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
        .status-tip .sync-status .sync-dot.error { background: #dc2626; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 24px;
            border-radius: 14px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
                padding-top: max(8px, env(safe-area-inset-top));
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>
            <div class="title-left">
                <!-- DS 图标 -->
                <span class="ds-icon"><span>DS</span></span>
                <span class="app-name">DeepSeek</span>
                <span class="version-tag">V4</span>
            </div>
            <div class="header-actions">
                <button class="toggle-collapse-btn" id="toggleCollapseBtn">⬆ 收起</button>
                <button class="btn-new" id="newSessionBtn">➕</button>
            </div>
        </h1>

        <div class="collapsible-section" id="collapsibleSection">
            <div class="api-section">
                <input type="password" id="apiKeyInput" placeholder="输入 API Key" />
                <button id="saveKeyBtn">保存</button>
            </div>
            <div class="control-bar">
                <div class="slider-group">
                    <label>📝</label>
                    <input type="range" id="maxTokensSlider" min="100" max="4096" value="2048" step="50" />
                    <span class="slider-value" id="maxTokensDisplay">2048</span>
                </div>
                <div class="rename-group">
                    <input type="text" id="renameInput" placeholder="重命名" />
                    <button id="renameBtn">重命名</button>
