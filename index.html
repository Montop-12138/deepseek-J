<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }
        h1 {
            font-size: 20px;
            color: #1a1a2e;
            text-align: center;
            padding: 8px 0;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 .title-left span {
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .header-actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-new {
            background: #4f6ef7;
            color: white;
        }
        .btn-new:active {
            opacity: 0.7;
        }

        .api-section {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: white;
        }
        .api-section input:focus {
            border-color: #4f6ef7;
        }
        .api-section input::placeholder {
            color: #b0b8c4;
        }
        .api-section button {
            padding: 8px 14px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .api-section button:active {
            opacity: 0.7;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            padding: 6px 0 10px;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
            font-size: 13px;
            color: #1a1a2e;
        }
        .control-bar .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 200px;
        }
        .control-bar .slider-group label {
            white-space: nowrap;
            font-weight: 500;
            font-size: 13px;
        }
        .control-bar .slider-group input[type="range"] {
            flex: 1;
            min-width: 60px;
            accent-color: #4f6ef7;
            height: 4px;
            cursor: pointer;
        }
        .control-bar .slider-value {
            min-width: 36px;
            text-align: center;
            font-weight: 600;
            color: #4f6ef7;
            font-size: 14px;
        }
        .control-bar .rename-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 180px;
        }
        .control-bar .rename-group input {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            min-width: 60px;
        }
        .control-bar .rename-group input:focus {
            border-color: #4f6ef7;
        }
        .control-bar .rename-group button {
            padding: 4px 10px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .control-bar .rename-group button:active {
            opacity: 0.7;
        }

        /* 分享/复制工具栏 */
        .share-bar {
            display: flex;
            gap: 6px;
            padding: 4px 0 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .share-bar button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .share-bar button:active {
            opacity: 0.7;
        }
        .share-bar .btn-copy {
            background: #4f6ef7;
            color: white;
        }
        .share-bar .btn-copy-all {
            background: #10b981;
            color: white;
        }
        .share-bar .btn-export {
            background: #f59e0b;
            color: white;
        }
        .share-bar .btn-select-mode {
            background: #8b5cf6;
            color: white;
        }
        .share-bar .btn-select-mode.active {
            background: #dc2626;
        }
        .share-bar .select-info {
            font-size: 12px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .share-bar .select-info input[type="checkbox"] {
            accent-color: #4f6ef7;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .session-bar {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid #e8ecf1;
            margin-bottom: 6px;
        }
        .session-bar::-webkit-scrollbar {
            height: 3px;
        }
        .session-bar::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 10px;
        }
        .session-tab {
            padding: 5px 14px;
            background: #e8ecf1;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: #1a1a2e;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .session-tab.active {
            background: #4f6ef7;
            color: white;
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 0 2px;
        }
        .session-tab .del-session:hover {
            opacity: 1;
        }
        .session-tab .del-session:active {
            opacity: 0.4;
        }
        .btn-add-session {
            padding: 5px 14px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-add-session:active {
            opacity: 0.7;
        }

        .chat-box {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid #e8ecf1;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
            width: 100%;
        }
        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }
        .message-wrapper .msg-actions {
            display: none;
            gap: 4px;
            margin-top: 2px;
            font-size: 12px;
        }
        .message-wrapper:hover .msg-actions {
            display: flex;
        }
        .message-wrapper .msg-actions button {
            background: #e8ecf1;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            color: #1a1a2e;
            transition: background 0.2s;
        }
        .message-wrapper .msg-actions button:hover {
            background: #d0d5dd;
        }
        .message-wrapper .msg-actions .del-msg-btn {
            color: #dc2626;
        }
        .message-wrapper .msg-actions .del-msg-btn:hover {
            background: #fee2e2;
        }
        .message-wrapper .msg-actions .edit-msg-btn {
            color: #4f6ef7;
        }
        .message-wrapper .msg-actions .edit-msg-btn:hover {
            background: #dbe4fe;
        }

        /* 选择模式 */
        .message-wrapper.select-mode .msg-actions {
            display: none !important;
        }
        .message-wrapper .msg-checkbox {
            display: none;
            margin-right: 6px;
            align-self: center;
        }
        .message-wrapper.select-mode .msg-checkbox {
            display: inline-block;
        }
        .message-wrapper.select-mode {
            flex-direction: row;
            align-items: center;
            gap: 4px;
        }
        .message-wrapper.select-mode .message {
            flex: 1;
        }

        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background: #4f6ef7;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #f0f2f5;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
            max-width: 90%;
            text-align: center;
        }
        .message .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.edit-mode .message-content {
            display: none;
        }
        .message.edit-mode .edit-textarea {
            display: block;
        }
        .message .edit-textarea {
            display: none;
            width: 100%;
            min-width: 200px;
            padding: 6px 10px;
            border: 2px solid #4f6ef7;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            background: white;
            outline: none;
        }
        .message .edit-textarea:focus {
            border-color: #4f6ef7;
        }
        .message .edit-actions {
            display: none;
            gap: 6px;
            margin-top: 4px;
        }
        .message.edit-mode .edit-actions {
            display: flex;
        }
        .message .edit-actions button {
            padding: 2px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .message .edit-actions .save-edit {
            background: #4f6ef7;
            color: white;
        }
        .message .edit-actions .cancel-edit {
            background: #e8ecf1;
            color: #1a1a2e;
        }
        .message .edit-actions .save-edit:active,
        .message .edit-actions .cancel-edit:active {
            opacity: 0.7;
        }

        .input-section {
            display: flex;
            gap: 6px;
            padding: 8px 0 0;
            flex-shrink: 0;
        }
        .input-section textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 100px;
            background: white;
        }
        .input-section textarea:focus {
            border-color: #4f6ef7;
        }
        .input-section button {
            padding: 8px 18px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            height: 44px;
        }
        .input-section button:active {
            opacity: 0.7;
        }
        .input-section button:disabled {
            background: #b0b8c4;
            cursor: not-allowed;
        }
        .status-tip {
            text-align: center;
            font-size: 11px;
            color: #9aa3b2;
            padding: 3px 0;
            flex-shrink: 0;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <h1>
        <div class="title-left">
            <span>🤖</span> DeepSeek
            <span style="font-size:12px;color:#9aa3b2;font-weight:400;margin-left:4px;">V4-Flash</span>
        </div>
        <div class="header-actions">
            <button class="btn-new" id="newSessionBtn">➕ 新建</button>
        </div>
    </h1>

    <div class="api-section">
        <input type="password" id="apiKeyInput" placeholder="输入 API Key" />
        <button id="saveKeyBtn">保存</button>
    </div>

    <div class="control-bar">
        <div class="slider-group">
            <label>📝 回复长度</label>
            <input type="range" id="maxTokensSlider" min="100" max="4096" value="2048" step="50" />
            <span class="slider-value" id="maxTokensDisplay">2048</span>
        </div>
        <div class="rename-group">
            <input type="text" id="renameInput" placeholder="新对话名" />
            <button id="renameBtn">重命名</button>
        </div>
    </div>

    <!-- 分享/复制工具栏 -->
    <div class="share-bar">
        <button class="btn-copy" id="copyLastBtn">📋 复制最后回复</button>
        <button class="btn-copy-all" id="copyAllBtn">📄 复制全部对话</button>
        <button class="btn-export" id="exportBtn">📤 导出为文本</button>
        <button class="btn-select-mode" id="selectModeBtn">☑️ 选择模式</button>
        <span class="select-info" id="selectInfo" style="display:none;">
            <input type="checkbox" id="selectAllCheckbox" /> 全选
            <span id="selectedCount">已选 0 条</span>
            <button class="btn-copy-all" id="copySelectedBtn" style="padding:2px 10px;font-size:12px;background:#10b981;color:white;border:none;border-radius:4px;cursor:pointer;">复制选中</button>
        </span>
    </div>

    <div class="session-bar" id="sessionBar"></div>

    <div class="chat-box" id="chatBox"></div>

    <div class="status-tip" id="statusTip">💡 模型: DeepSeek-V4-Flash | 已就绪</div>

    <div class="input-section">
        <textarea id="userInput" rows="1" placeholder="输入消息..." disabled></textarea>
        <button id="sendBtn" disabled>发送</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  DOM 引用
        // ============================================================
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');
        const sessionBar = document.getElementById('sessionBar');
        const newSessionBtn = document.getElementById('newSessionBtn');

        const maxTokensSlider = document.getElementById('maxTokensSlider');
        const maxTokensDisplay = document.getElementById('maxTokensDisplay');
        const renameInput = document.getElementById('renameInput');
        const renameBtn = document.getElementById('renameBtn');

        // 分享/复制
        const copyLastBtn = document.getElementById('copyLastBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const exportBtn = document.getElementById('exportBtn');
        const selectModeBtn = document.getElementById('selectModeBtn');
        const selectInfo = document.getElementById('selectInfo');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const selectedCount = document.getElementById('selectedCount');
        const copySelectedBtn = document.getElementById('copySelectedBtn');

        let selectMode = false;
        let selectedIndices = new Set();

        let toastTimer = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        //  数据结构
        // ============================================================
        let sessions = [];
        let currentSessionId = null;
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';

        const STORAGE_KEY_SESSIONS = 'deepseek_sessions';
        const STORAGE_KEY_CURRENT = 'deepseek_current_session';
        const STORAGE_KEY_MAX_TOKENS = 'deepseek_max_tokens';

        // ============================================================
        //  会话管理
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        }

        function getSessionName(messages) {
            for (let m of messages) {
                if (m.role === 'user') {
                    const txt = m.content.replace(/\n/g, ' ').trim();
                    return txt.length > 15 ? txt.substring(0, 15) + '…' : txt;
                }
            }
            return '新对话';
        }

        function createSession(name) {
            return {
                id: generateId(),
                name: name || '新对话',
                messages: []
            };
        }

        function saveSessions() {
            localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(sessions));
            if (currentSessionId) {
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            }
        }

        function loadSessions() {
            const data = localStorage.getItem(STORAGE_KEY_SESSIONS);
            if (data) {
                try {
                    sessions = JSON.parse(data);
                } catch (e) {
                    sessions = [];
                }
            } else {
                sessions = [];
            }
            if (sessions.length === 0) {
                const s = createSession('对话 1');
                sessions.push(s);
            }
            const savedCurrent = localStorage.getItem(STORAGE_KEY_CURRENT);
            if (savedCurrent && sessions.some(s => s.id === savedCurrent)) {
                currentSessionId = savedCurrent;
            } else {
                currentSessionId = sessions[0].id;
            }
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId) || sessions[0];
        }

        function switchSession(sessionId) {
            if (sessionId === currentSessionId) return;
            // 退出选择模式
            exitSelectMode();
            currentSessionId = sessionId;
            localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            renderChat();
            renderSessionTabs();
            const session = getCurrentSession();
            renameInput.value = session.name || '';
            const hasKey = !!API_KEY;
            enableChat(hasKey);
        }

        function deleteSession(sessionId) {
            if (sessions.length <= 1) {
                showToast('至少保留一个对话');
                return;
            }
            if (!confirm('确定删除这个对话吗？')) return;
            exitSelectMode();
            sessions = sessions.filter(s => s.id !== sessionId);
            if (currentSessionId === sessionId) {
                currentSessionId = sessions[0].id;
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            }
            saveSessions();
            renderSessionTabs();
            renderChat();
            enableChat(!!API_KEY);
            showToast('已删除');
        }

        function addNewSession() {
            exitSelectMode();
            const s = createSession('新对话');
            sessions.push(s);
            currentSessionId = s.id;
            saveSessions();
            renderSessionTabs();
            renderChat();
            renameInput.value = s.name || '';
            enableChat(!!API_KEY);
            if (API_KEY) userInput.focus();
            showToast('✅ 已创建新对话');
        }

        function renameCurrentSession(newName) {
            const session = getCurrentSession();
            if (!session) return;
            const trimmed = newName.trim();
            if (!trimmed) {
                showToast('请输入有效名称');
                return;
            }
            session.name = trimmed;
            saveSessions();
            renderSessionTabs();
            showToast('✅ 已重命名为: ' + trimmed);
        }

        // ============================================================
        //  消息操作
        // ============================================================
        function deleteMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            if (session.messages[index].role === 'loading') return;
            if (!confirm('确定删除这条消息吗？')) return;
            exitSelectMode();
            session.messages.splice(index, 1);
            saveSessions();
            renderChat();
            showToast('已删除');
        }

        function startEditMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            const msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading') return;

            const wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                const wrapper = wrappers[index];
                const msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    document.querySelectorAll('.message.edit-mode').forEach(el => el.classList.remove('edit-mode'));
                    msgDiv.classList.add('edit-mode');
                    const textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        textarea.value = msg.content;
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }
        }

        function saveEditMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            const msg = session.messages[index];

            const wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                const wrapper = wrappers[index];
                const msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    const textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        const newContent = textarea.value.trim();
                        if (!newContent) {
                            showToast('内容不能为空');
                            return;
                        }
                        msg.content = newContent;
                        msgDiv.classList.remove('edit-mode');
                        saveSessions();
                        renderChat();

                        if (msg.role === 'user') {
                            const nextIndex = index + 1;
                            if (nextIndex < session.messages.length) {
                                session.messages.splice(nextIndex);
                                saveSessions();
                            }
                            setTimeout(() => {
                                callDeepSeek(newContent, true);
                            }, 100);
                        }
                        showToast('✅ 已修改');
                    }
                }
            }
        }

        function cancelEditMessage() {
            document.querySelectorAll('.message.edit-mode').forEach(el => el.classList.remove('edit-mode'));
        }

        // ============================================================
        //  选择模式
        // ============================================================
        function toggleSelectMode() {
            selectMode = !selectMode;
            if (selectMode) {
                selectedIndices.clear();
                selectModeBtn.textContent = '❌ 退出选择';
                selectModeBtn.classList.add('active');
                selectInfo.style.display = 'flex';
                selectAllCheckbox.checked = false;
                updateSelectedCount();
            } else {
                exitSelectMode();
            }
            renderChat();
        }

        function exitSelectMode() {
            selectMode = false;
            selectedIndices.clear();
            selectModeBtn.textContent = '☑️ 选择模式';
            selectModeBtn.classList.remove('active');
            selectInfo.style.display = 'none';
            renderChat();
        }

        function toggleSelectMessage(index) {
            if (!selectMode) return;
            const session = getCurrentSession();
            if (!session) return;
            const msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading') return;
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
            } else {
                selectedIndices.add(index);
            }
            updateSelectedCount();
            renderChat();
        }

        function updateSelectedCount() {
            selectedCount.textContent = '已选 ' + selectedIndices.size + ' 条';
            const session = getCurrentSession();
            if (session) {
                const total = session.messages.filter(m => m.role !== 'error' && m.role !== 'loading').length;
                selectAllCheckbox.checked = selectedIndices.size === total && total > 0;
            }
        }

        function selectAllMessages() {
            const session = getCurrentSession();
            if (!session) return;
            const allChecked = selectAllCheckbox.checked;
            selectedIndices.clear();
            if (allChecked) {
                session.messages.forEach((msg, idx) => {
                    if (msg.role !== 'error' && msg.role !== 'loading') {
                        selectedIndices.add(idx);
                    }
                });
            }
            updateSelectedCount();
            renderChat();
        }

        function getSelectedText() {
            const session = getCurrentSession();
            if (!session) return '';
            const sorted = Array.from(selectedIndices).sort((a, b) => a - b);
            let text = '📝 ' + session.name + '\n' + '='.repeat(40) + '\n\n';
            sorted.forEach(idx => {
                const msg = session.messages[idx];
                if (msg) {
                    const label = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                    text += '【' + label + '】\n' + msg.content + '\n\n';
                }
            });
            return text;
        }

        function getAllText() {
            const session = getCurrentSession();
            if (!session) return '';
            let text = '📝 ' + session.name + '\n' + '='.repeat(40) + '\n\n';
            session.messages.forEach(msg => {
                if (msg.role === 'error' || msg.role === 'loading') return;
                const label = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                text += '【' + label + '】\n' + msg.content + '\n\n';
            });
            return text;
        }

        function getLastReply() {
            const session = getCurrentSession();
            if (!session) return '';
            for (let i = session.messages.length - 1; i >= 0; i--) {
                if (session.messages[i].role === 'assistant') {
                    return session.messages[i].content;
                }
            }
            return '';
        }

        function copyToClipboard(text) {
            if (!text) {
                showToast('没有内容可复制');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ 已复制到剪贴板');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制到剪贴板');
            } catch (e) {
                showToast('❌ 复制失败，请手动选择复制');
            }
            document.body.removeChild(textarea);
        }

                    del.className = 'del-session';
                    del.textContent = '✕';
                    del.addEventListener('click', (e) => {
