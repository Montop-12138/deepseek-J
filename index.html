<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <!-- 引入腾讯云开发 SDK -->
    <script src="https://web.sdk.qcloud.com/cloudbase/v1.6.0/cloudbase.full.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }
        h1 {
            font-size: 20px;
            color: #1a1a2e;
            text-align: center;
            padding: 8px 0;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 .title-left span {
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .header-actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-new {
            background: #4f6ef7;
            color: white;
        }
        .btn-new:active {
            opacity: 0.7;
        }
        .api-section {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: white;
        }
        .api-section input:focus {
            border-color: #4f6ef7;
        }
        .api-section input::placeholder {
            color: #b0b8c4;
        }
        .api-section button {
            padding: 8px 14px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .api-section button:active {
            opacity: 0.7;
        }
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            padding: 6px 0 10px;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
            font-size: 13px;
            color: #1a1a2e;
        }
        .control-bar .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 200px;
        }
        .control-bar .slider-group label {
            white-space: nowrap;
            font-weight: 500;
            font-size: 13px;
        }
        .control-bar .slider-group input[type="range"] {
            flex: 1;
            min-width: 60px;
            accent-color: #4f6ef7;
            height: 4px;
            cursor: pointer;
        }
        .control-bar .slider-value {
            min-width: 36px;
            text-align: center;
            font-weight: 600;
            color: #4f6ef7;
            font-size: 14px;
        }
        .control-bar .rename-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 180px;
        }
        .control-bar .rename-group input {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #d0d5dd;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            min-width: 60px;
        }
        .control-bar .rename-group input:focus {
            border-color: #4f6ef7;
        }
        .control-bar .rename-group button {
            padding: 4px 10px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .control-bar .rename-group button:active {
            opacity: 0.7;
        }
        .share-bar {
            display: flex;
            gap: 6px;
            padding: 4px 0 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .share-bar button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .share-bar button:active {
            opacity: 0.7;
        }
        .share-bar .btn-copy {
            background: #4f6ef7;
            color: white;
        }
        .share-bar .btn-copy-all {
            background: #10b981;
            color: white;
        }
        .share-bar .btn-export {
            background: #f59e0b;
            color: white;
        }
        .share-bar .btn-select-mode {
            background: #8b5cf6;
            color: white;
        }
        .share-bar .btn-select-mode.active {
            background: #dc2626;
        }
        .share-bar .select-info {
            font-size: 12px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .share-bar .select-info input[type="checkbox"] {
            accent-color: #4f6ef7;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .session-bar {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid #e8ecf1;
            margin-bottom: 6px;
        }
        .session-bar::-webkit-scrollbar {
            height: 3px;
        }
        .session-bar::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 10px;
        }
        .session-tab {
            padding: 5px 14px;
            background: #e8ecf1;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: #1a1a2e;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .session-tab.active {
            background: #4f6ef7;
            color: white;
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 0 2px;
        }
        .session-tab .del-session:hover {
            opacity: 1;
        }
        .session-tab .del-session:active {
            opacity: 0.4;
        }
        .btn-add-session {
            padding: 5px 14px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-add-session:active {
            opacity: 0.7;
        }
        .chat-box {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid #e8ecf1;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
            width: 100%;
        }
        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }
        .message-wrapper .msg-actions {
            display: none;
            gap: 4px;
            margin-top: 2px;
            font-size: 12px;
        }
        .message-wrapper:hover .msg-actions {
            display: flex;
        }
        .message-wrapper .msg-actions button {
            background: #e8ecf1;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            color: #1a1a2e;
            transition: background 0.2s;
        }
        .message-wrapper .msg-actions button:hover {
            background: #d0d5dd;
        }
        .message-wrapper .msg-actions .del-msg-btn {
            color: #dc2626;
        }
        .message-wrapper .msg-actions .del-msg-btn:hover {
            background: #fee2e2;
        }
        .message-wrapper .msg-actions .edit-msg-btn {
            color: #4f6ef7;
        }
        .message-wrapper .msg-actions .edit-msg-btn:hover {
            background: #dbe4fe;
        }
        .message-wrapper.select-mode .msg-actions {
            display: none !important;
        }
        .message-wrapper .msg-checkbox {
            display: none;
            margin-right: 6px;
            align-self: center;
        }
        .message-wrapper.select-mode .msg-checkbox {
            display: inline-block;
        }
        .message-wrapper.select-mode {
            flex-direction: row;
            align-items: center;
            gap: 4px;
        }
        .message-wrapper.select-mode .message {
            flex: 1;
        }
        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background: #4f6ef7;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #f0f2f5;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
            max-width: 90%;
            text-align: center;
        }
        .message .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.edit-mode .message-content {
            display: none;
        }
        .message.edit-mode .edit-textarea {
            display: block;
        }
        .message .edit-textarea {
            display: none;
            width: 100%;
            min-width: 200px;
            padding: 6px 10px;
            border: 2px solid #4f6ef7;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            background: white;
            outline: none;
        }
        .message .edit-textarea:focus {
            border-color: #4f6ef7;
        }
        .message .edit-actions {
            display: none;
            gap: 6px;
            margin-top: 4px;
        }
        .message.edit-mode .edit-actions {
            display: flex;
        }
        .message .edit-actions button {
            padding: 2px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .message .edit-actions .save-edit {
            background: #4f6ef7;
            color: white;
        }
        .message .edit-actions .cancel-edit {
            background: #e8ecf1;
            color: #1a1a2e;
        }
        .message .edit-actions .save-edit:active,
        .message .edit-actions .cancel-edit:active {
            opacity: 0.7;
        }
        .input-section {
            display: flex;
            gap: 6px;
            padding: 8px 0 0;
            flex-shrink: 0;
        }
        .input-section textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 100px;
            background: white;
        }
        .input-section textarea:focus {
            border-color: #4f6ef7;
        }
        .input-section button {
            padding: 8px 18px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            height: 44px;
        }
        .input-section button:active {
            opacity: 0.7;
        }
        .input-section button:disabled {
            background: #b0b8c4;
            cursor: not-allowed;
        }
        .status-tip {
            text-align: center;
            font-size: 11px;
            color: #9aa3b2;
            padding: 3px 0;
            flex-shrink: 0;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
        /* 同步状态指示器 */
        .sync-status {
            font-size: 11px;
            color: #9aa3b2;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
        }
        .sync-status .sync-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }
        .sync-status .sync-dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        .sync-status .sync-dot.error {
            background: #dc2626;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <h1>
        <div class="title-left">
            <span>🤖</span> DeepSeek
            <span style="font-size:12px;color:#9aa3b2;font-weight:400;margin-left:4px;">V4-Flash</span>
        </div>
        <div class="header-actions">
            <button class="btn-new" id="newSessionBtn">➕ 新建</button>
        </div>
    </h1>

    <div class="api-section">
        <input type="password" id="apiKeyInput" placeholder="输入 API Key" />
        <button id="saveKeyBtn">保存</button>
    </div>

    <div class="control-bar">
        <div class="slider-group">
            <label>📝 回复长度</label>
            <input type="range" id="maxTokensSlider" min="100" max="4096" value="2048" step="50" />
            <span class="slider-value" id="maxTokensDisplay">2048</span>
        </div>
        <div class="rename-group">
            <input type="text" id="renameInput" placeholder="新对话名" />
            <button id="renameBtn">重命名</button>
        </div>
    </div>

    <div class="share-bar">
        <button class="btn-copy" id="copyLastBtn">📋 复制最后回复</button>
        <button class="btn-copy-all" id="copyAllBtn">📄 复制全部对话</button>
        <button class="btn-export" id="exportBtn">📤 导出为文本</button>
        <button class="btn-select-mode" id="selectModeBtn">☑️ 选择模式</button>
        <span class="select-info" id="selectInfo" style="display:none;">
            <input type="checkbox" id="selectAllCheckbox" /> 全选
            <span id="selectedCount">已选 0 条</span>
            <button class="btn-copy-all" id="copySelectedBtn" style="padding:2px 10px;font-size:12px;background:#10b981;color:white;border:none;border-radius:4px;cursor:pointer;">复制选中</button>
        </span>
    </div>

    <div class="session-bar" id="sessionBar"></div>

    <div class="chat-box" id="chatBox"></div>

    <div class="status-tip" id="statusTip">
        <span class="sync-status" id="syncStatus">
            <span class="sync-dot" id="syncDot"></span>
            <span id="syncText">已同步</span>
        </span>
        💡 模型: DeepSeek-V4-Flash | 已就绪
    </div>

    <div class="input-section">
        <textarea id="userInput" rows="1" placeholder="输入消息..." disabled></textarea>
        <button id="sendBtn" disabled>发送</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  配置
        // ============================================================
        const ENV_ID = 'deepseek-chat-d5gg0748z3b9dfe24';

        // ============================================================
        //  初始化 CloudBase
        // ============================================================
        const app = cloudbase.init({
            env: ENV_ID
        });

        const db = app.database();
        const _ = db.command;

        let currentUser = null;

        // ============================================================
        //  数据层
        // ============================================================
        const COLLECTION = 'sessions';

        // 确保集合存在（CloudBase 会自动创建）
        async function initDatabase() {
            try {
                // 尝试读取一条数据来验证集合是否存在
                await db.collection(COLLECTION).limit(1).get();
            } catch (e) {
                // 如果集合不存在，创建它
                try {
                    await db.createCollection(COLLECTION);
                    console.log('✅ 集合创建成功');
                } catch (err) {
                    console.log('集合可能已存在或需要手动创建');
                }
            }
        }

        // ============================================================
        //  用户管理
        // ============================================================
        async function getOrCreateUser() {
            try {
                // 尝试匿名登录
                const auth = app.auth();
                const loginState = await auth.getLoginState();

                if (loginState) {
                    currentUser = loginState.user;
                    console.log('✅ 用户已登录:', currentUser.uid);
                    return currentUser;
                }

                // 匿名登录
                await auth.anonymousAuthProvider().signIn();
                const newState = await auth.getLoginState();
                currentUser = newState.user;
                console.log('✅ 匿名登录成功:', currentUser.uid);
                return currentUser;
            } catch (e) {
                console.error('❌ 登录失败:', e);
                showToast('⚠️ 云端连接失败，数据将保存在本地');
                return null;
            }
        }

        // ============================================================
        //  同步函数
        // ============================================================
        async function syncSessionsToCloud(sessionsData) {
            if (!currentUser) return false;

            try {
                const collection = db.collection(COLLECTION);
                // 先删除用户的所有旧数据
                await collection.where({
                    userId: currentUser.uid
                }).remove();

                // 批量插入新数据
                const batch = [];
                for (const session of sessionsData) {
                    batch.push({
                        userId: currentUser.uid,
                        sessionId: session.id,
                        name: session.name || '新对话',
                        messages: session.messages || [],
                        updatedAt: new Date().toISOString()
                    });
                }

                if (batch.length > 0) {
                    await collection.add(batch);
                }

                console.log('✅ 数据已同步到云端');
                updateSyncStatus('已同步', '');
                return true;
            } catch (e) {
                console.error('❌ 同步失败:', e);
                updateSyncStatus('同步失败', 'error');
                return false;
            }
        }

        async function loadSessionsFromCloud() {
            if (!currentUser) return null;

            try {
                const collection = db.collection(COLLECTION);
                const result = await collection.where({
                    userId: currentUser.uid
                }).get();

                if (result.data && result.data.length > 0) {
                    const sessions = result.data.map(item => ({
                        id: item.sessionId,
                        name: item.name || '新对话',
                        messages: item.messages || []
                    }));
                    console.log('✅ 从云端加载了', sessions.length, '个会话');
                    updateSyncStatus('已同步', '');
                    return sessions;
                }
                return null;
            } catch (e) {
                console.error('❌ 加载云端数据失败:', e);
                updateSyncStatus('加载失败', 'error');
                return null;
            }
        }

        // ============================================================
        //  同步状态指示器
        // ============================================================
        function updateSyncStatus(text, status) {
            const dot = document.getElementById('syncDot');
            const textEl = document.getElementById('syncText');
            textEl.textContent = text;
            dot.className = 'sync-dot';
            if (status === 'syncing') {
                dot.classList.add('syncing');
            } else if (status === 'error') {
                dot.classList.add('error');
            }
        }

        // ============================================================
        //  DOM 引用
        // ============================================================
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');
        const sessionBar = document.getElementById('sessionBar');
        const newSessionBtn = document.getElementById('newSessionBtn');

        const maxTokensSlider = document.getElementById('maxTokensSlider');
        const maxTokensDisplay = document.getElementById('maxTokensDisplay');
        const renameInput = document.getElementById('renameInput');
        const renameBtn = document.getElementById('renameBtn');

        const copyLastBtn = document.getElementById('copyLastBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const exportBtn = document.getElementById('exportBtn');
        const selectModeBtn = document.getElementById('selectModeBtn');
        const selectInfo = document.getElementById('selectInfo');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const selectedCount = document.getElementById('selectedCount');
        const copySelectedBtn = document.getElementById('copySelectedBtn');

        let selectMode = false;
        let selectedIndices = new Set();

        let toastTimer = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        //  数据结构
        // ============================================================
        let sessions = [];
        let currentSessionId = null;
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let isCloudReady = false;

        const STORAGE_KEY_SESSIONS = 'deepseek_sessions';
        const STORAGE_KEY_CURRENT = 'deepseek_current_session';
        const STORAGE_KEY_MAX_TOKENS = 'deepseek_max_tokens';

        // ============================================================
        //  会话管理
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        }

        function getSessionName(messages) {
            for (let m of messages) {
                if (m.role === 'user') {
                    const txt = m.content.replace(/\n/g, ' ').trim();
                    return txt.length > 15 ? txt.substring(0, 15) + '…' : txt;
                }
            }
            return '新对话';
        }

        function createSession(name) {
            return {
                id: generateId(),
                name: name || '新对话',
                messages: []
            };
        }

        async function saveSessions() {
            // 保存到 localStorage
            localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(sessions));
            if (currentSessionId) {
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            }

            // 同步到云端
            if (isCloudReady && currentUser) {
                updateSyncStatus('同步中...', 'syncing');
                await syncSessionsToCloud(sessions);
            }
        }

        function loadSessions() {
            const data = localStorage.getItem(STORAGE_KEY_SESSIONS);
            if (data) {
                try {
                    sessions = JSON.parse(data);
                } catch (e) {
                    sessions = [];
                }
            } else {
                sessions = [];
            }
            if (sessions.length === 0) {
                const s = createSession('对话 1');
                sessions.push(s);
            }
            const savedCurrent = localStorage.getItem(STORAGE_KEY_CURRENT);
            if (savedCurrent && sessions.some(s => s.id === savedCurrent)) {
                currentSessionId = savedCurrent;
            } else {
                currentSessionId = sessions[0].id;
            }
        }

        async function loadFromCloudAndMerge() {
            const cloudData = await loadSessionsFromCloud();
            if (cloudData && cloudData.length > 0) {
                // 比较云端和本地，取最新版本
                // 简单策略：云端有数据就用云端的
                sessions = cloudData;
                const savedCurrent = localStorage.getItem(STORAGE_KEY_CURRENT);
                if (savedCurrent && sessions.some(s => s.id === savedCurrent)) {
                    currentSessionId = savedCurrent;
                } else {
                    currentSessionId = sessions[0].id;
                }
                // 同时更新 localStorage
                localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(sessions));
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
                return true;
            }
            return false;
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId) || sessions[0];
        }

        function switchSession(sessionId) {
            if (sessionId === currentSessionId) return;
            exitSelectMode();
            currentSessionId = sessionId;
            localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            renderChat();
            renderSessionTabs();
            const session = getCurrentSession();
            renameInput.value = session.name || '';
            const hasKey = !!API_KEY;
            enableChat(hasKey);
        }

        function deleteSession(sessionId) {
            if (sessions.length <= 1) {
                showToast('至少保留一个对话');
                return;
            }
            if (!confirm('确定删除这个对话吗？')) return;
            exitSelectMode();
            sessions = sessions.filter(s => s.id !== sessionId);
            if (currentSessionId === sessionId) {
                currentSessionId = sessions[0].id;
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            }
            saveSessions();
            renderSessionTabs();
            renderChat();
            enableChat(!!API_KEY);
            showToast('已删除');
        }

        function addNewSession() {
            exitSelectMode();
            const s = createSession('新对话');
            sessions.push(s);
            currentSessionId = s.id;
            saveSessions();
            renderSessionTabs();
            renderChat();
            renameInput.value = s.name || '';
            enableChat(!!API_KEY);
            if (API_KEY) userInput.focus();
            showToast('✅ 已创建新对话');
        }

        function renameCurrentSession(newName) {
            const session = getCurrentSession();
            if (!session) return;
            const trimmed = newName.trim();
            if (!trimmed) {
                showToast('请输入有效名称');
                return;
            }
            session.name = trimmed;
            saveSessions();
            renderSessionTabs();
            showToast('✅ 已重命名为: ' + trimmed);
        }

        // ============================================================
        //  消息操作
        // ============================================================
        function deleteMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            if (session.messages[index].role === 'loading') return;
            if (!confirm('确定删除这条消息吗？')) return;
            exitSelectMode();
            session.messages.splice(index, 1);
            saveSessions();
            renderChat();
            showToast('已删除');
        }

        function startEditMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            const msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading') return;

            const wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                const wrapper = wrappers[index];
                const msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    document.querySelectorAll('.message.edit-mode').forEach(el => el.classList.remove('edit-mode'));
                    msgDiv.classList.add('edit-mode');
                    const textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        textarea.value = msg.content;
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }
        }

        function saveEditMessage(index) {
            const session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            const msg = session.messages[index];

            const wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                const wrapper = wrappers[index];
                const msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    const textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        const newContent = textarea.value.trim();
                        if (!newContent) {
                            showToast('内容不能为空');
                            return;
                        }
                        msg.content = newContent;
                        msgDiv.classList.remove('edit-mode');
                        saveSessions();
                        renderChat();

                        if (msg.role === 'user') {
                            const nextIndex = index + 1;
                            if (nextIndex < session.messages.length) {
                                session.messages.splice(nextIndex);
                                saveSessions();
                            }
                            setTimeout(() => {
                                callDeepSeek(newContent, true);
                            }, 100);
                        }
                        showToast('✅ 已修改');
                    }
                }
            }
        }

        function cancelEditMessage() {
            document.querySelectorAll('.message.edit-mode').forEach(el => el.classList.remove('edit-mode'));
        }
