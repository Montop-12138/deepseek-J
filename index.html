<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }
        h1 {
            font-size: 20px;
            color: #1a1a2e;
            text-align: center;
            padding: 8px 0;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 .title-left span {
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .header-actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-new {
            background: #4f6ef7;
            color: white;
        }
        .btn-new:active {
            opacity: 0.7;
        }

        /* API Key 区域 */
        .api-section {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: white;
        }
        .api-section input:focus {
            border-color: #4f6ef7;
        }
        .api-section input::placeholder {
            color: #b0b8c4;
        }
        .api-section button {
            padding: 8px 14px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .api-section button:active {
            opacity: 0.7;
        }

        /* 会话列表 */
        .session-bar {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid #e8ecf1;
            margin-bottom: 6px;
        }
        .session-bar::-webkit-scrollbar {
            height: 3px;
        }
        .session-bar::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 10px;
        }
        .session-tab {
            padding: 5px 14px;
            background: #e8ecf1;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: #1a1a2e;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .session-tab.active {
            background: #4f6ef7;
            color: white;
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 0 2px;
        }
        .session-tab .del-session:hover {
            opacity: 1;
        }
        .session-tab .del-session:active {
            opacity: 0.4;
        }
        .btn-add-session {
            padding: 5px 14px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-add-session:active {
            opacity: 0.7;
        }

        /* 聊天框 */
        .chat-box {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid #e8ecf1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            background: #4f6ef7;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #f0f2f5;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
            max-width: 90%;
            text-align: center;
        }
        .message .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 输入区域 */
        .input-section {
            display: flex;
            gap: 6px;
            padding: 8px 0 0;
            flex-shrink: 0;
        }
        .input-section textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 100px;
            background: white;
        }
        .input-section textarea:focus {
            border-color: #4f6ef7;
        }
        .input-section button {
            padding: 8px 18px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            height: 44px;
        }
        .input-section button:active {
            opacity: 0.7;
        }
        .input-section button:disabled {
            background: #b0b8c4;
            cursor: not-allowed;
        }
        .status-tip {
            text-align: center;
            font-size: 11px;
            color: #9aa3b2;
            padding: 3px 0;
            flex-shrink: 0;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <h1>
        <div class="title-left">
            <span>🤖</span> DeepSeek
        </div>
        <div class="header-actions">
            <button class="btn-new" id="newSessionBtn">➕ 新建</button>
        </div>
    </h1>

    <!-- API Key -->
    <div class="api-section">
        <input type="password" id="apiKeyInput" placeholder="输入 API Key" />
        <button id="saveKeyBtn">保存</button>
    </div>

    <!-- 会话标签栏 -->
    <div class="session-bar" id="sessionBar">
        <!-- 由 JS 动态生成 -->
    </div>

    <!-- 聊天框 -->
    <div class="chat-box" id="chatBox"></div>

    <div class="status-tip" id="statusTip">💡 模型: DeepSeek-V3</div>

    <div class="input-section">
        <textarea id="userInput" rows="1" placeholder="输入消息..." disabled></textarea>
        <button id="sendBtn" disabled>发送</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  DOM 引用
        // ============================================================
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');
        const sessionBar = document.getElementById('sessionBar');
        const newSessionBtn = document.getElementById('newSessionBtn');

        let toastTimer = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        //  数据结构
        // ============================================================
        // 每个会话：{ id: string, name: string, messages: [{role, content}] }
        let sessions = [];
        let currentSessionId = null;
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';

        // 存储 key
        const STORAGE_KEY_SESSIONS = 'deepseek_sessions';
        const STORAGE_KEY_CURRENT = 'deepseek_current_session';

        // ============================================================
        //  会话管理
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        }

        function getSessionName(messages) {
            // 取第一条用户消息的前 15 个字作为会话名
            for (let m of messages) {
                if (m.role === 'user') {
                    const txt = m.content.replace(/\n/g, ' ').trim();
                    return txt.length > 15 ? txt.substring(0, 15) + '…' : txt;
                }
            }
            return '新对话';
        }

        function createSession(name) {
            return {
                id: generateId(),
                name: name || '新对话',
                messages: []
            };
        }

        function saveSessions() {
            localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(sessions));
            if (currentSessionId) {
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            }
        }

        function loadSessions() {
            const data = localStorage.getItem(STORAGE_KEY_SESSIONS);
            if (data) {
                try {
                    sessions = JSON.parse(data);
                } catch (e) {
                    sessions = [];
                }
            } else {
                sessions = [];
            }
            // 如果没会话，创建一个默认的
            if (sessions.length === 0) {
                const s = createSession('对话 1');
                sessions.push(s);
            }
            // 恢复当前会话 ID
            const savedCurrent = localStorage.getItem(STORAGE_KEY_CURRENT);
            if (savedCurrent && sessions.some(s => s.id === savedCurrent)) {
                currentSessionId = savedCurrent;
            } else {
                currentSessionId = sessions[0].id;
            }
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId) || sessions[0];
        }

        function switchSession(sessionId) {
            if (sessionId === currentSessionId) return;
            // 保存当前会话
            saveCurrentChat();
            currentSessionId = sessionId;
            localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            renderChat();
            renderSessionTabs();
            // 启用/禁用输入
            const hasKey = !!API_KEY;
            enableChat(hasKey);
        }

        function deleteSession(sessionId) {
            if (sessions.length <= 1) {
                showToast('至少保留一个对话');
                return;
            }
            if (!confirm('确定删除这个对话吗？')) return;
            sessions = sessions.filter(s => s.id !== sessionId);
            if (currentSessionId === sessionId) {
                currentSessionId = sessions[0].id;
                localStorage.setItem(STORAGE_KEY_CURRENT, currentSessionId);
            }
            saveSessions();
            renderSessionTabs();
            renderChat();
            enableChat(!!API_KEY);
            showToast('已删除');
        }

        function addNewSession() {
            const s = createSession('新对话');
            sessions.push(s);
            // 切换到新会话
            currentSessionId = s.id;
            saveSessions();
            renderSessionTabs();
            renderChat();
            enableChat(!!API_KEY);
            // 自动聚焦输入
            if (API_KEY) userInput.focus();
            showToast('✅ 已创建新对话');
        }

        // ============================================================
        //  渲染
        // ============================================================
        function renderSessionTabs() {
            sessionBar.innerHTML = '';
            sessions.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'session-tab' + (s.id === currentSessionId ? ' active' : '');
                // 显示会话名
                const nameSpan = document.createElement('span');
                nameSpan.textContent = s.name || '新对话';
                btn.appendChild(nameSpan);
                // 删除按钮（仅当不止一个会话）
                if (sessions.length > 1) {
                    const del = document.createElement('button');
                    del.className = 'del-session';
                    del.textContent = '✕';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteSession(s.id);
                    });
                    btn.appendChild(del);
                }
                btn.addEventListener('click', () => {
                    switchSession(s.id);
                });
                sessionBar.appendChild(btn);
            });
            // 添加按钮
            const addBtn = document.createElement('button');
            addBtn.className = 'btn-add-session';
            addBtn.textContent = '+';
            addBtn.addEventListener('click', addNewSession);
            sessionBar.appendChild(addBtn);
        }

        function renderChat() {
            const session = getCurrentSession();
            chatBox.innerHTML = '';
            if (!session || session.messages.length === 0) {
                const div = document.createElement('div');
                div.className = 'message assistant';
                if (API_KEY) {
                    div.textContent = '👋 开始新对话吧！输入消息开始聊天。';
                } else {
                    div.textContent = '👋 请先在上方输入你的 API Key 开始对话。';
                }
                chatBox.appendChild(div);
                return;
            }
            session.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message ' + msg.role;
                div.innerHTML = msg.content.replace(/\n/g, '<br>');
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addMessageToCurrent(role, content) {
            const session = getCurrentSession();
            if (!session) return;
            session.messages.push({ role, content });
            // 更新会话名（如果是第一条用户消息）
            if (role === 'user' && session.messages.length === 1) {
                const name = getSessionName(session.messages);
                session.name = name;
                renderSessionTabs();
            }
            saveSessions();
            renderChat();
        }

        function saveCurrentChat() {
            // 只是在切换时自动保存（已经保存了）
        }

        // ============================================================
        //  加载状态
        // ============================================================
        function showLoading() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'loadingMessage';
            div.innerHTML = '🤔 思考中<span class="loading-dots"></span>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideLoading() {
            const el = document.getElementById('loadingMessage');
            if (el) el.remove();
        }

        // ============================================================
        //  调用 API
        // ============================================================
        async function callDeepSeek(userMessage) {
            if (!API_KEY) {
                addMessageToCurrent('error', '⚠️ 请先设置 API Key');
                return;
            }

            // 添加用户消息
            addMessageToCurrent('user', userMessage);
            userInput.value = '';
            userInput.style.height = 'auto';
            showLoading();
            sendBtn.disabled = true;

            // 获取当前会话的所有消息作为上下文
            const session = getCurrentSession();
            const history = session.messages.filter(m => m.role !== 'error').map(m => ({
                role: m.role,
                content: m.content
            }));

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        messages: [
                            { role: 'system', content: '你是一个有用的AI助手，请用中文回复。' },
                            ...history
                        ],
                        stream: false,
                        max_tokens: 4096,
                        temperature: 0.7
                    })
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error('服务器返回了非JSON格式数据，请检查API Key是否有效');
                }

                hideLoading();

                if (!response.ok) {
                    const errorMsg = data.error ? data.error.message : '请求失败';
                    throw new Error('错误 ' + response.status + ': ' + errorMsg);
                }

                const reply = data.choices && data.choices[0] && data.choices[0].message
                    ? data.choices[0].message.content
                    : '未获取到有效回复';

                addMessageToCurrent('assistant', reply);
                // 更新会话名（如果还没命名）
                if (session.messages.length > 0 && session.name === '新对话') {
                    const name = getSessionName(session.messages);
                    session.name = name;
                    renderSessionTabs();
                    saveSessions();
                }

            } catch (error) {
                hideLoading();
                let errorText = '❌ ' + error.message;
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    errorText = '❌ 网络连接失败，请检查网络或API地址是否正确';
                } else if (error.message.includes('401') || error.message.includes('403')) {
                    errorText = '❌ API Key 无效或已过期，请重新输入';
                    localStorage.removeItem('deepseek_api_key');
                    API_KEY = '';
                    enableChat(false);
                    apiKeyInput.value = '';
                }
                addMessageToCurrent('error', errorText);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ============================================================
        //  API Key & 聊天控制
        // ============================================================
        function enableChat(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                userInput.focus();
                statusTip.textContent = '💡 模型: DeepSeek-V3 | 已就绪';
                statusTip.style.color = '#4f6ef7';
            } else {
                statusTip.textContent = '⏳ 请先输入 API Key';
                statusTip.style.color = '#9aa3b2';
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            // 加载 API Key
            if (API_KEY) {
                apiKeyInput.value = API_KEY;
            }

            // 加载会话
            loadSessions();

            // 渲染
            renderSessionTabs();
            renderChat();

            // 启用聊天
            if (API_KEY) {
                enableChat(true);
            } else {
                enableChat(false);
                apiKeyInput.focus();
            }
        }

        // ============================================================
        //  事件绑定
        // ============================================================

        // 保存 API Key
        saveKeyBtn.addEventListener('click', function() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert('请输入有效的 API Key');
                return;
            }
            if (!key.startsWith('sk-')) {
                alert('⚠️ API Key 格式不正确，应该以 sk- 开头');
                return;
            }
            API_KEY = key;
            localStorage.setItem('deepseek_api_key', key);
            enableChat(true);
            // 清除错误消息
            const session = getCurrentSession();
            if (session) {
                session.messages = session.messages.filter(m => m.role !== 'error');
                saveSessions();
                renderChat();
            }
            // 如果聊天框空，加提示
            if (session && session.messages.length === 0) {
                addMessageToCurrent('assistant', '✅ API Key 保存成功！可以开始聊天了。');
            } else {
                // 如果已有消息，加一条系统提示
                addMessageToCurrent('assistant', '✅ API Key 已更新！');
            }
            showToast('✅ API Key 已保存');
        });

        // 发送
        sendBtn.addEventListener('click', function() {
            const msg = userInput.value.trim();
            if (!msg) return;
            if (!API_KEY) {
                addMessageToCurrent('error', '⚠️ 请先设置 API Key');
                return;
            }
            callDeepSeek(msg);
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // 新建会话（头部按钮）
        newSessionBtn.addEventListener('click', addNewSession);

        // ============================================================
        //  启动
        // ============================================================
        init();
    </script>

</body>
</html>
